<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" role="img" aria-label="Filament profiles">
<title>Filament profiles</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
}
.cpb { animation: glow 3s ease-in-out infinite; }</style>

<defs><linearGradient id="cpg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#12aee8" stop-opacity=".2"/><stop offset=".6" stop-color="#12aee8" stop-opacity="0"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="589" height="249" rx="20" fill="#181c22" stroke="#262c35"/>
<rect x=".5" y=".5" width="589" height="249" rx="20" fill="url(#cpg)"/>
<rect class="cpb" x="1" y="1" width="588" height="248" rx="20" fill="none" stroke="#12aee8" stroke-width="2" opacity=".4"/>
<g transform="translate(58 58)">
<defs>
  <clipPath id="cpclip"><circle r="76"/></clipPath>
  <filter id="cpblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<g transform="translate(0 0) scale(0.3)">
  <circle class="cphalo" r="98" fill="none" stroke="#2b8ef0" stroke-width="10" filter="url(#cpblur)" opacity=".5"/>
  <circle r="96" fill="#0a0c0f" stroke="#2b8ef0" stroke-width="9"/>
  <circle r="86" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="3"/>
  <g transform="rotate(-45)">
    <g clip-path="url(#cpclip)"><rect class="cpa" x="-100" y="-100" width="117" height="75" fill="#9ea3a8"/><rect class="cpb" x="25" y="-100" width="75" height="117" fill="#12aee8"/><rect class="cpc" x="-17" y="25" width="117" height="75" fill="#0b9fdc"/><rect class="cpd" x="-100" y="-17" width="75" height="117" fill="#7cccf7"/></g>
    <rect class="cpdia" x="-17" y="-17" width="34" height="34" fill="#f4f6f8"/>
  </g>
</g></g>
<g class="fade"><text x="104" y="56" fill="#f4f6f8" font-size="27" font-weight="800">Filament profiles</text>
<text x="105" y="84" fill="#93a0b0" font-size="16">3dtrcek-filament-profiles</text></g>
<g class="fade" style="animation-delay:0.30s"><g transform="translate(36 138) rotate(45)"><rect x="-4" y="-4" width="8" height="8" fill="#12aee8"/></g><text x="54" y="144" fill="#f4f6f8" font-size="17">Official Bambu Lab H2S and X1 / P1 profiles</text></g><g class="fade" style="animation-delay:0.45s"><g transform="translate(36 170) rotate(45)"><rect x="-4" y="-4" width="8" height="8" fill="#12aee8"/></g><text x="54" y="176" fill="#f4f6f8" font-size="17">Community profiles for Prusa, Creality, Voron…</text></g><g class="fade" style="animation-delay:0.60s"><g transform="translate(36 202) rotate(45)"><rect x="-4" y="-4" width="8" height="8" fill="#12aee8"/></g><text x="54" y="208" fill="#f4f6f8" font-size="17">Share yours – no Git needed</text></g>

</svg>
