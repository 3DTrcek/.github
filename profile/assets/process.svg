</g>
<text x="1110.0" y="112" text-anchor="middle" fill="#12aee8" font-size="18" font-weight="600">Your printer</text></g><circle class="dot " r="7" fill="#12aee8"/><circle class="dot dot2" r="7" fill="#12aee8"/><circle class="dot dot3" r="7" fill="#12aee8"/>
