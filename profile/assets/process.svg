<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Process: Granulate → Compounding → Extrusion → Spooling → QC → Your printer">
<title>Process: Granulate → Compounding → Extrusion → Spooling → QC → Your printer</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
}

.dot { offset-path: path('M90.0 55 H1110.0'); animation: flow 6s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes flow { 0% { offset-distance: 0%; opacity: 0; } 6% { opacity: 1; } 90% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
.dot2 { animation-delay: 2s; } .dot3 { animation-delay: 4s; }
.p0 { animation-delay: 0.10s; }.p1 { animation-delay: 0.22s; }.p2 { animation-delay: 0.34s; }.p3 { animation-delay: 0.46s; }.p4 { animation-delay: 0.58s; }.p5 { animation-delay: 0.70s; }</style>
<path d="M90.0 55 H1110.0" stroke="#262c35" stroke-width="6" stroke-linecap="round"/><g class="fade p0"><g transform="translate(90.0 55)">
  <circle r="22" fill="#181c22" stroke="#2b8ef0" stroke-width="3"/>
  <g transform="rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="#f4f6f8"/></g>
</g>
<text x="90.0" y="112" text-anchor="middle" fill="#f4f6f8" font-size="18" font-weight="600">Granulate</text></g><g class="fade p1"><g transform="translate(294.0 55)">
  <circle r="22" fill="#181c22" stroke="#2b8ef0" stroke-width="3"/>
  <g transform="rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="#f4f6f8"/></g>
</g>
<text x="294.0" y="112" text-anchor="middle" fill="#f4f6f8" font-size="18" font-weight="600">Compounding</text></g><g class="fade p2"><g transform="translate(498.0 55)">
  <circle r="22" fill="#181c22" stroke="#2b8ef0" stroke-width="3"/>
  <g transform="rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="#f4f6f8"/></g>
</g>
<text x="498.0" y="112" text-anchor="middle" fill="#f4f6f8" font-size="18" font-weight="600">Extrusion</text></g><g class="fade p3"><g transform="translate(702.0 55)">
  <circle r="22" fill="#181c22" stroke="#2b8ef0" stroke-width="3"/>
  <g transform="rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="#f4f6f8"/></g>
</g>
<text x="702.0" y="112" text-anchor="middle" fill="#f4f6f8" font-size="18" font-weight="600">Spooling</text></g><g class="fade p4"><g transform="translate(906.0 55)">
  <circle r="22" fill="#181c22" stroke="#2b8ef0" stroke-width="3"/>
