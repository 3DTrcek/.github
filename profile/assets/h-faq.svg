<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="FAQ">
<title>FAQ</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
}
.hd { animation-delay: .1s; } .hs { animation-delay: .3s; } .ic { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }</style>

<rect x="0.5" y="0.5" width="1199" height="79" rx="16" fill="#181c22" stroke="#262c35"/>
<g transform="translate(48 40)"><circle r="26" fill="#111418" stroke="#262c35"/><g><circle r="16" fill="none" stroke="#12aee8" stroke-width="3"/><path d="M-5 -5 a5 5 0 1 1 7 4.5 c-2 1 -2 2 -2 4" fill="none" stroke="#f4f6f8" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="9" r="2" fill="#f4f6f8"/></g></g>
<g class="fade hd"><text x="92" y="37" fill="#f4f6f8" font-size="28" font-weight="700">FAQ</text></g>
<g class="fade hs"><text x="93" y="62" fill="#93a0b0" font-size="17">Quick answers about profiles, materials and ordering</text></g>

</svg>
