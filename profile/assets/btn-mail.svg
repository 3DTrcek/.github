<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="Contact us">
<title>Contact us</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
}
.shine { animation: sh 4s ease-in-out infinite; } @keyframes sh { 0%,70% { transform: translateX(-120px); } 100% { transform: translateX(400px); } }</style>

<defs><clipPath id="bc"><rect width="280" height="64" rx="32"/></clipPath>
<linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="278" height="62" rx="31" fill="#181c22" stroke="#9ea3a8" stroke-width="2"/>
<g clip-path="url(#bc)"><rect class="shine" x="0" y="0" width="80" height="64" fill="url(#bs)"/></g>
<g transform="translate(40 32)" fill="none" stroke="#f4f6f8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -8 h24 v16 h-24 z M-12 -8 l12 9 l12 -9"/></g>
<text x="154.0" y="39" text-anchor="middle" fill="#f4f6f8" font-size="19" font-weight="700">Contact us</text>

</svg>
