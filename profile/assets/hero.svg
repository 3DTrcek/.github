<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="3DTrcek – European 3D printing filament, made in Ljubljana, Slovenia">
<title>3DTrcek – European 3D printing filament, made in Ljubljana, Slovenia</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
}
.ha { opacity: 0; animation: hak .9s cubic-bezier(.2,.8,.2,1) 0.15s forwards; }@keyframes hak { from { opacity: 0; transform: translate(0px,-40px); } to { opacity: 1; transform: translate(0,0); } }.hb { opacity: 0; animation: hbk .9s cubic-bezier(.2,.8,.2,1) 0.27s forwards; }@keyframes hbk { from { opacity: 0; transform: translate(40px,0px); } to { opacity: 1; transform: translate(0,0); } }.hc { opacity: 0; animation: hck .9s cubic-bezier(.2,.8,.2,1) 0.39s forwards; }@keyframes hck { from { opacity: 0; transform: translate(0px,40px); } to { opacity: 1; transform: translate(0,0); } }.hd { opacity: 0; animation: hdk .9s cubic-bezier(.2,.8,.2,1) 0.51s forwards; }@keyframes hdk { from { opacity: 0; transform: translate(-40px,0px); } to { opacity: 1; transform: translate(0,0); } }.hdia { transform-box: fill-box; transform-origin: center; opacity: 0; animation: hpop .6s cubic-bezier(.3,1.6,.5,1) .75s forwards; }@keyframes hpop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }.hhalo { animation: glow 3.2s ease-in-out 1.2s infinite; }
.bg-grid { opacity: .5; }
.t1 { animation-delay: .5s; } .t2 { animation-delay: .75s; } .t3 { animation-delay: 1s; }
.print { stroke-dasharray: 2116; stroke-dashoffset: 2116; animation: printk 5s linear 1.3s infinite; }
@keyframes printk { 0% { stroke-dashoffset: 2116; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 95%,100% { stroke-dashoffset: 0; opacity: 0; } }
.nozzle { offset-path: path('M560 300 h520 v12 h-520 v12 h520 v12 h-520'); offset-rotate: 0deg; animation: nozk 5s linear 1.3s infinite; offset-distance: 0%; }
@keyframes nozk { 0% { offset-distance: 0%; } 80%,100% { offset-distance: 100%; } }
.scan { animation: scank 6s ease-in-out infinite; }
@keyframes scank { 0%,100% { transform: translateX(-200px); opacity: 0; } 40%,60% { opacity: .5; } 50% { transform: translateX(1300px); opacity: 0; } }
</style>

<defs>
  <radialGradient id="hglow" cx="20%" cy="48%" r="45%"><stop offset="0" stop-color="#2b8ef0" stop-opacity=".28"/><stop offset="1" stop-color="#2b8ef0" stop-opacity="0"/></radialGradient>
  <linearGradient id="hscan" x1="0" x2="1"><stop offset="0" stop-color="#12aee8" stop-opacity="0"/><stop offset=".5" stop-color="#12aee8" stop-opacity=".25"/><stop offset="1" stop-color="#12aee8" stop-opacity="0"/></linearGradient>
  <clipPath id="hround"><rect width="1200" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#hround)">
  <rect width="1200" height="420" fill="#111418"/>
  <g class="bg-grid" stroke="#1d232b" stroke-width="1"><line x1="0" y1="0" x2="0" y2="420" /><line x1="40" y1="0" x2="40" y2="420" /><line x1="80" y1="0" x2="80" y2="420" /><line x1="120" y1="0" x2="120" y2="420" /><line x1="160" y1="0" x2="160" y2="420" /><line x1="200" y1="0" x2="200" y2="420" /><line x1="240" y1="0" x2="240" y2="420" /><line x1="280" y1="0" x2="280" y2="420" /><line x1="320" y1="0" x2="320" y2="420" /><line x1="360" y1="0" x2="360" y2="420" /><line x1="400" y1="0" x2="400" y2="420" /><line x1="440" y1="0" x2="440" y2="420" /><line x1="480" y1="0" x2="480" y2="420" /><line x1="520" y1="0" x2="520" y2="420" /><line x1="560" y1="0" x2="560" y2="420" /><line x1="600" y1="0" x2="600" y2="420" /><line x1="640" y1="0" x2="640" y2="420" /><line x1="680" y1="0" x2="680" y2="420" /><line x1="720" y1="0" x2="720" y2="420" /><line x1="760" y1="0" x2="760" y2="420" /><line x1="800" y1="0" x2="800" y2="420" /><line x1="840" y1="0" x2="840" y2="420" /><line x1="880" y1="0" x2="880" y2="420" /><line x1="920" y1="0" x2="920" y2="420" /><line x1="960" y1="0" x2="960" y2="420" /><line x1="1000" y1="0" x2="1000" y2="420" /><line x1="1040" y1="0" x2="1040" y2="420" /><line x1="1080" y1="0" x2="1080" y2="420" /><line x1="1120" y1="0" x2="1120" y2="420" /><line x1="1160" y1="0" x2="1160" y2="420" /><line x1="1200" y1="0" x2="1200" y2="420" /><line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="40" x2="1200" y2="40" /><line x1="0" y1="80" x2="1200" y2="80" /><line x1="0" y1="120" x2="1200" y2="120" /><line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="200" x2="1200" y2="200" /><line x1="0" y1="240" x2="1200" y2="240" /><line x1="0" y1="280" x2="1200" y2="280" /><line x1="0" y1="320" x2="1200" y2="320" /><line x1="0" y1="360" x2="1200" y2="360" /><line x1="0" y1="400" x2="1200" y2="400" /></g>
  <rect width="1200" height="420" fill="url(#hglow)"/>
  <rect class="scan" x="0" y="0" width="160" height="420" fill="url(#hscan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="419" rx="24" fill="none" stroke="#262c35"/>

<defs>
  <clipPath id="hclip"><circle r="79"/></clipPath>
  <filter id="hblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<g transform="translate(250 200) scale(1.2)">
  <circle class="hhalo" r="98" fill="none" stroke="#2b8ef0" stroke-width="10" filter="url(#hblur)" opacity=".5"/>
  <circle r="96" fill="#0a0c0f" stroke="#2b8ef0" stroke-width="9"/>
  <circle r="86" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="3"/>
  <g transform="rotate(-45)">
    <g clip-path="url(#hclip)"><rect class="ha" x="-21" y="-100" width="121" height="68" fill="#9ea3a8"/><rect class="hb" x="32" y="-21" width="68" height="121" fill="#12aee8"/><rect class="hc" x="-100" y="32" width="121" height="68" fill="#0ea6e4"/><rect class="hd" x="-100" y="-100" width="68" height="121" fill="#7cccf7"/></g>
    <rect class="hdia" x="-21" y="-21" width="42" height="42" fill="#f4f6f8"/>
  </g>
</g>
<g class="fade t1"><text x="560" y="150" fill="#f4f6f8" font-size="76" font-weight="800" letter-spacing="-1">3DTrcek</text></g>
<g class="fade t2"><text x="563" y="200" fill="#12aee8" font-size="26" font-weight="600">European 3D printing filament</text></g>
<g class="fade t3"><text x="563" y="242" fill="#93a0b0" font-size="20">Compounded, extruded &amp; spooled in-house in Ljubljana, Slovenia</text></g>
<path class="print" d="M560 300 h520 v12 h-520 v12 h520 v12 h-520" fill="none" stroke="#12aee8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="nozzle"><g transform="translate(0 -6)">
  <rect x="-14" y="-42" width="28" height="22" rx="3" fill="#3a414b"/>
  <path d="M-9 -20 h18 l-6 14 h-6 z" fill="#c9a24a"/>
  <circle cx="0" cy="-3" r="2.5" fill="#12aee8"/>
</g></g>

</svg>
